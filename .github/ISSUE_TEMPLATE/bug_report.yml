name: Bug report
description: Report a problem with the game or documentation
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Steps to reproduce, expected vs actual behavior
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Firefox
        - Other
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      placeholder: https://ismaiidogan.github.io/TestLab-29119/
    validations:
      required: false
